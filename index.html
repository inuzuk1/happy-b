<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>З Днем Народження, Маріє!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        
        .bg-gif {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.9;
        }
        
        .container {
            background-color: rgba(15, 14, 23, 0.7);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 80%;
            animation: fadeIn 1.5s ease-out;
            border: 1px solid rgba(255, 137, 6, 0.3);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #fffffe;
        }
        
        .name {
            font-size: 4.5rem;
            font-weight: bold;
            margin: 1rem 0;
            background: linear-gradient(45deg, #ff8906, #e53170);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(229, 49, 112, 0.5);
        }
        
        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .heart {
            font-size: 4rem;
            animation: pulse 1.5s infinite;
            display: inline-block;
            color: #e53170;
        }
        
        .btn {
            background: linear-gradient(45deg, #e53170, #ff8906);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(229, 49, 112, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-top: 20px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(229, 49, 112, 0.6);
        }

        .stiker{
            width: 200px;
            height: 200px
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .name { font-size: 3rem; }
            p { font-size: 1.2rem; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <img src="1f12ca05fd40ea2e.gif" 
         class="bg-gif" 
         alt="Animated background">
    
    <div class="container">
        <h1>З Днем Народження,</h1>
        <div class="name">Маня(talvi)!</div>
        <p>Нехай цей день буде наповнений радістю, <br>сміхом і незабутніми моментами!</p>
        <img src="sticker.webp" alt="" class="stiker">
        
        <button class="btn" onclick="showMessage()">Натисни для сюрпризу</button>
    </div>

    <script>
        function showMessage() {
            const messages = [
                "я би твою попочку поцiлував би"
            ];
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            alert(randomMessage + " 😈😏😜💖");
        }
        
        // Додатковий ефект при завантаженні
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            container.style.transform = 'scale(0.9)';
            setTimeout(() => {
                container.style.transform = 'scale(1)';
                container.style.transition = 'transform 0.5s ease';
            }, 100);
        });
    </script>
</body>
</html>
